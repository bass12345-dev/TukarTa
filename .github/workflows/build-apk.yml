name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://atowgxluqogdsxxeavna.supabase.co
      EXPO_PUBLIC_SUPABASE_KEY: sb_publishable_XpJ2cR82YOAmiZORI4_n2g_uXMugJDY
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_XpJ2cR82YOAmiZORI4_n2g_uXMugJDY
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies with hoisting (fixes Metro bundler module resolution)
        run: |
          # Force pnpm to hoist all packages so Metro/Babel can resolve babel-preset-expo
          pnpm install --no-frozen-lockfile

      - name: Write .env for Expo bundle
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=https://atowgxluqogdsxxeavna.supabase.co" > .env
          echo "EXPO_PUBLIC_SUPABASE_KEY=sb_publishable_XpJ2cR82YOAmiZORI4_n2g_uXMugJDY" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_XpJ2cR82YOAmiZORI4_n2g_uXMugJDY" >> .env

      - name: Expo Prebuild Android
        run: npx expo prebuild --platform android --no-install

      - name: Configure Gradle memory & build Release APK
        run: |
          echo "" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" >> android/gradle.properties
          # Make Metro/Babel use the hoisted node_modules (NODE_PATH ensures babel-preset-expo is found)
          export NODE_PATH="$PWD/node_modules"
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon -x lint -x test
          cp app/build/outputs/apk/release/app-release.apk ../TukarTa.apk

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TukarTa-APK
          path: TukarTa.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0-latest TukarTa.apk \
            --title "TukarTa Android APK (Latest)" \
            --notes "Standalone Android APK with Phone Google Login, Real BPM Scraping, YouTube-to-Lyrics Sync, and Song Dictionary Practice Mode." \
            || gh release upload v1.0.0-latest TukarTa.apk --clobber
